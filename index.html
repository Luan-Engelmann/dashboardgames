<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Jogos oTalDoTroia</title>
    
    <link rel="icon" type="image/png" href="Logo.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ==============================
           VARIÁVEIS DE COR E TEMA
           ============================== */
        :root {
            --bg-body: #0d0d17; 
            --bg-card: #161625; 
            --bg-card-hover: #1e1e33; 
            --text-main: #ffffff;
            --text-muted: #8b8ba7;
            --accent-purple: #8257e5; 
            --accent-pink: #ff007f;   
            --accent-cyan: #00e5ff;   
            --accent-green: #00ff88;  
            --gradient-main: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            --border-color: #2a2a40;
            --font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: var(--font-family); padding: 20px; line-height: 1.6; }
        .container { max-width: 1700px; margin: 0 auto; }
        h2, h3 { font-weight: 600; letter-spacing: 0.5px; }

        /* CABEÇALHO */
        .header { text-align: center; padding: 40px 0; background: radial-gradient(circle at center, #251d3a 0%, var(--bg-body) 70%); border-bottom: 1px solid var(--border-color); margin-bottom: 30px; border-radius: 12px; }
        .logo-container { width: 120px; height: 120px; margin: 0 auto 20px; border-radius: 50%; background: var(--bg-card); border: 4px solid var(--border-color); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 20px rgba(130, 87, 229, 0.3); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .header h1 { font-size: 32px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; background-color: rgba(0, 255, 136, 0.1); color: var(--accent-green); padding: 8px 20px; border-radius: 50px; font-size: 14px; border: 1px solid rgba(0, 255, 136, 0.3); margin-bottom: 25px; }
        .header-actions { display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-add { background-color: var(--accent-purple); }

        /* CARDS DO TOPO */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background-color: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gradient-main); }
        .stat-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .stat-card p { font-size: 32px; color: var(--text-main); font-weight: bold; font-family: 'Courier New', monospace; }
        .stat-card p.hours { color: var(--accent-pink); }
        .stat-card p.total { color: var(--accent-cyan); }

        /* KANBAN BOARD */
        .board-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-items: start; }
        .board-col { background-color: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); min-height: 400px; transition: background-color 0.2s; display: flex; flex-direction: column; }
        .col-content { flex: 1; min-height: 50px; }
        .board-col.drag-over { background-color: var(--bg-card-hover); border-style: dashed; border-color: var(--accent-cyan); }

        .board-col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); }
        .board-col-title { font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .col-1 .board-col-title { color: var(--text-muted); }
        .col-2 .board-col-title { color: var(--accent-cyan); }
        .col-3 .board-col-title { color: var(--accent-pink); }
        .col-4 .board-col-title { color: var(--accent-green); }
        .col-count { background-color: rgba(255,255,255,0.05); color: var(--text-muted); padding: 2px 10px; border-radius: 50px; font-size: 12px; }

        /* GAME CARD */
        .game-card { background-color: #ffffff; border-radius: 8px; padding: 20px; margin-bottom: 15px; color: #1a1a1a; transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent; }
        .game-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .game-card.dragging { opacity: 0.4; transform: scale(0.95); box-shadow: none; border: 2px dashed var(--accent-purple); }
        
        .game-tags { display: flex; gap: 6px; margin-bottom: 12px; }
        .game-tag { color: white; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; background-color: var(--accent-purple); }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .game-info { font-size: 13px; color: #555; margin-bottom: 20px; }
        .game-info div { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .game-info i { width: 18px; text-align: center; color: var(--accent-purple); }
        .btn-youtube { background-color: #c4302b; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none;}
        .card-actions { display: flex; gap: 8px; border-top: 1px solid #eee; padding-top: 12px; }
        .btn-action { flex: 1; padding: 7px; border: 1px solid #ddd; background-color: #f9f9f9; border-radius: 6px; font-size: 12px; cursor: pointer; color: #333; }
        .btn-action:hover { background-color: #eee; }
        .btn-action.delete { color: #d63031; border-color: rgba(214, 48, 49, 0.2); }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(130, 87, 229, 0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: var(--accent-cyan); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        
        /* FORMULÁRIO */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: white; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-purple); }
        .btn-submit { width: 100%; background: var(--gradient-main); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }

        /* LOADER */
        .loader { display: none; margin: 20px auto; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-cyan); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- CABECALHO -->
    <div class="header">
        <div class="logo-container">
            <img src="Logo.png" alt="Logo">
        </div>
        <h1>Gerenciador de Jogos oTalDoTroia</h1>
        <div class="status-badge"><i class="fa-solid fa-circle-check"></i> <span id="headerTotalGames">0</span> jogo(s) na biblioteca</div>
        
        <div class="header-actions">
            <button class="btn" id="btnLogin" onclick="openLoginModal()" style="background-color: var(--border-color);"><i class="fa-solid fa-lock"></i> Acesso Restrito</button>
            <button class="btn btn-add" id="btnNovoJogo" onclick="openModal()" style="display: none;"><i class="fa-solid fa-plus"></i> Novo Jogo</button>
            <button class="btn" id="btnLogout" onclick="logoutAdmin()" style="display: none; background-color: #c4302b;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
    </div>

    <!-- RESUMO DE HORAS -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3><i class="fa-regular fa-clock"></i> TOTAL DE HORAS</h3>
            <p class="hours" id="statTotalHours">0:00h</p>
        </div>
        <div class="stat-card">
            <h3><i class="fa-solid fa-book-open"></i> HORAS DE HISTÓRIA</h3>
            <p class="hours" id="statStoryHours">0:00h</p>
        </div>
        <div class="stat-card">
            <h3><i class="fa-solid fa-trophy"></i> HORAS DE PLATINA</h3>
            <p class="hours" id="statPlatHours">0:00h</p>
        </div>
        <div class="stat-card">
            <h3><i class="fa-solid fa-gamepad"></i> TOTAL DE JOGOS</h3>
            <p class="total" id="statTotalGames">0</p>
        </div>
    </div>

    <div id="mainLoader" class="loader" style="display: block;"></div>

    <!-- KANBAN BOARD -->
    <div class="board-grid">
        <div class="board-col col-1" ondragover="allowDrop(event)" ondrop="drop(event, 1)">
            <div class="board-col-header">
                <div class="board-col-title">A JOGAR</div>
                <div class="col-count" id="count-col-1">0</div>
            </div>
            <div id="col-1-content" class="col-content"></div>
        </div>

        <div class="board-col col-2" ondragover="allowDrop(event)" ondrop="drop(event, 2)">
            <div class="board-col-header">
                <div class="board-col-title">JOGANDO HISTÓRIA</div>
                <div class="col-count" id="count-col-2">0</div>
            </div>
            <div id="col-2-content" class="col-content"></div>
        </div>

        <div class="board-col col-3" ondragover="allowDrop(event)" ondrop="drop(event, 3)">
            <div class="board-col-header">
                <div class="board-col-title">PLATINA / PÓS</div>
                <div class="col-count" id="count-col-3">0</div>
            </div>
            <div id="col-3-content" class="col-content"></div>
        </div>

        <div class="board-col col-4" ondragover="allowDrop(event)" ondrop="drop(event, 4)">
            <div class="board-col-header">
                <div class="board-col-title">FINALIZADOS</div>
                <div class="col-count" id="count-col-4">0</div>
            </div>
            <div id="col-4-content" class="col-content"></div>
        </div>
    </div>
</div>

<!-- MODAL DE LOGIN -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-content" style="max-width: 350px;">
        <div class="modal-header">
            <h2 style="color: var(--accent-pink);">Acesso Restrito</h2>
            <button class="close-btn" onclick="closeLoginModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="inputEmail" placeholder="Digite o e-mail autorizado">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="inputSenha" placeholder="Digite a senha">
        </div>
        <button onclick="fazerLogin()" id="btnEntrar" class="btn-submit" style="background: var(--accent-pink);">Entrar</button>
    </div>
</div>

<!-- MODAL DE JOGO -->
<div class="modal-overlay" id="addGameModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Adicionar Novo Jogo</h2>
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="gameForm" onsubmit="saveGame(event)">
            <div class="form-group">
                <label>Nome do Jogo *</label>
                <input type="text" id="inputName" required placeholder="Ex: God of War">
            </div>
            <div class="form-group">
                <label>Status / Coluna *</label>
                <select id="inputStatus">
                    <option value="1">A Jogar</option>
                    <option value="2">Jogando História</option>
                    <option value="3">Platina / Pós-game</option>
                    <option value="4">Finalizado</option>
                </select>
            </div>
            <div class="form-group">
                <label>Plataforma</label>
                <input type="text" id="inputPlatform" placeholder="Ex: PlayStation, PC, Xbox">
            </div>
            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Tempo de História (HH:MM)</label>
                    <input type="text" id="inputStoryHours" placeholder="00:00" oninput="mascaraTempo(this)">
                </div>
                <div style="flex: 1;">
                    <label>Tempo de Platina/Extra (HH:MM)</label>
                    <input type="text" id="inputPlatHours" placeholder="00:00" oninput="mascaraTempo(this)">
                </div>
            </div>
            <div class="form-group">
                <label>Link da Playlist do YouTube (Opcional)</label>
                <input type="url" id="inputUrl" placeholder="https://youtube.com/...">
            </div>
            <button type="submit" id="btnSubmit" class="btn-submit">Salvar Jogo</button>
        </form>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÕES DO SUPABASE
    // ==========================================
    const SUPABASE_PROJECT_URL = "https://odbfnjehaiohmahkyvlk.supabase.co";
    const SUPABASE_URL = `${SUPABASE_PROJECT_URL}/rest/v1/jogos`;
    const SUPABASE_AUTH_URL = `${SUPABASE_PROJECT_URL}/auth/v1/token?grant_type=password`;
    const SUPABASE_KEY = "sb_publishable_yrG8wkw56PNlfuFfs7-c4Q_Kp-hjUxQ";

    let games = [];
    let editingGameId = null;

    // ==========================================
    // SISTEMA DE LOGIN INTEGRADO AO SUPABASE
    // ==========================================
    let isAdmin = localStorage.getItem('adminLogado') === 'true';
    let adminToken = localStorage.getItem('adminToken') || null;

    function getHeaders() {
        return {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${adminToken ? adminToken : SUPABASE_KEY}`,
            'Prefer': 'return=representation' 
        };
    }

    function checkAdminStatus() {
        if (isAdmin) {
            document.getElementById('btnNovoJogo').style.display = 'flex';
            document.getElementById('btnLogout').style.display = 'flex';
            document.getElementById('btnLogin').style.display = 'none';
        } else {
            document.getElementById('btnNovoJogo').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'none';
            document.getElementById('btnLogin').style.display = 'flex';
        }
    }

    function openLoginModal() {
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('inputEmail').value = '';
        document.getElementById('inputSenha').value = '';
    }

    function closeLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
    }

    async function fazerLogin() {
        const email = document.getElementById('inputEmail').value;
        const senha = document.getElementById('inputSenha').value;
        const btn = document.getElementById('btnEntrar');

        if (!email || !senha) return alert("Preencha o e-mail e a senha!");

        btn.innerText = "Autenticando...";
        btn.disabled = true;

        try {
            const response = await fetch(SUPABASE_AUTH_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                body: JSON.stringify({ email: email, password: senha })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error_description || 'Erro no login');

            localStorage.setItem('adminLogado', 'true');
            localStorage.setItem('adminToken', data.access_token);
            isAdmin = true;
            adminToken = data.access_token;
            
            closeLoginModal();
            checkAdminStatus();
            renderDashboard();

        } catch (error) {
            alert("Acesso negado: E-mail ou senha incorretos.");
        } finally {
            btn.innerText = "Entrar";
            btn.disabled = false;
        }
    }

    function logoutAdmin() {
        localStorage.removeItem('adminLogado');
        localStorage.removeItem('adminToken');
        isAdmin = false;
        adminToken = null;
        checkAdminStatus();
        renderDashboard(); 
    }

    checkAdminStatus();

    // ==========================================
    // FUNÇÕES DE UTILIDADE PARA TEMPO
    // ==========================================
    function mascaraTempo(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length > 2) valor = valor.replace(/(\d{2})$/, ':$1'); 
        input.value = valor;
    }

    function parseTempoParaMinutos(tempo) {
        if (!tempo) return 0;
        const str = String(tempo);
        if (str.includes(':')) {
            const partes = str.split(':');
            return (parseInt(partes[0]) || 0) * 60 + (parseInt(partes[1]) || 0);
        }
        return Math.round((parseFloat(str) || 0) * 60);
    }

    function formataMinutosParaTempo(totalMinutos) {
        if (totalMinutos === 0) return "0:00";
        const horas = Math.floor(totalMinutos / 60);
        const minutos = Math.round(totalMinutos % 60);
        return `${horas}:${minutos.toString().padStart(2, '0')}`;
    }

    // ==========================================
    // FUNÇÕES DE BANCO DE DADOS (SUPABASE)
    // ==========================================

    async function fetchGames() {
        document.getElementById('mainLoader').style.display = 'block';
        try {
            // Agora busca os jogos respeitando primeiro a ordem manual, e depois o ID para desempatar
            const response = await fetch(`${SUPABASE_URL}?select=*&order=ordem.asc,id.asc`, { headers: getHeaders() });
            if (!response.ok) throw new Error("Erro ao buscar dados");
            
            games = await response.json();
            renderDashboard();
        } catch (error) {
            console.error(error);
        } finally {
            document.getElementById('mainLoader').style.display = 'none';
        }
    }

    async function saveGame(event) {
        event.preventDefault(); 
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "Salvando...";
        btn.disabled = true;

        const gameData = {
            name: document.getElementById('inputName').value,
            status: document.getElementById('inputStatus').value,
            platform: document.getElementById('inputPlatform').value || 'Não informada',
            storyHours: document.getElementById('inputStoryHours').value || "0:00",
            platHours: document.getElementById('inputPlatHours').value || "0:00",
            url: document.getElementById('inputUrl').value
        };

        try {
            if (editingGameId !== null) {
                // Ao editar, não enviamos a 'ordem' para que ela não seja zerada/alterada
                await fetch(`${SUPABASE_URL}?id=eq.${editingGameId}`, {
                    method: 'PATCH',
                    headers: getHeaders(),
                    body: JSON.stringify(gameData)
                });
            } else {
                // Novos jogos recebem ordem 999 para irem pro final da coluna
                gameData.ordem = 999;
                await fetch(SUPABASE_URL, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(gameData)
                });
            }
            
            closeModal();
            await fetchGames();
        } catch (error) {
            console.error("Erro ao salvar:", error);
            alert("Erro ao salvar. Verifique se a coluna 'ordem' foi criada no Supabase.");
        } finally {
            btn.innerText = "Salvar Jogo";
            btn.disabled = false;
        }
    }

    async function deleteGame(id) {
        if(confirm("Tem certeza que deseja excluir este jogo da nuvem?")) {
            try {
                games = games.filter(game => game.id !== id);
                renderDashboard(); 

                await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
            } catch (error) {
                console.error("Erro ao deletar:", error);
            }
        }
    }

    // ==========================================
    // FUNÇÕES DO MODAL E KANBAN (DRAG & DROP VISUAL)
    // ==========================================

    function openModal(id = null) {
        editingGameId = id;
        if (id !== null) {
            document.getElementById('modalTitle').innerText = "Editar Jogo";
            const game = games.find(g => g.id === id);
            if (game) {
                document.getElementById('inputName').value = game.name || '';
                document.getElementById('inputStatus').value = game.status || '1';
                document.getElementById('inputPlatform').value = game.platform || '';
                document.getElementById('inputStoryHours').value = game.storyHours || '0:00';
                document.getElementById('inputPlatHours').value = game.platHours || '0:00';
                document.getElementById('inputUrl').value = game.url || '';
            }
        } else {
            document.getElementById('modalTitle').innerText = "Adicionar Novo Jogo";
            document.getElementById('gameForm').reset();
        }
        document.getElementById('addGameModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('addGameModal').style.display = 'none';
        document.getElementById('gameForm').reset();
        editingGameId = null;
    }

    // 1. Inicia o Arrastar
    function dragStart(event, id) {
        if(!isAdmin) return;
        event.dataTransfer.setData("gameId", id);
        setTimeout(() => event.target.classList.add('dragging'), 0);
    }

    function dragEnd(event) {
        if(!isAdmin) return;
        event.target.classList.remove('dragging');
    }

    // 2. Move os cards dinamicamente enquanto arrasta
    function allowDrop(event) {
        if(!isAdmin) return;
        event.preventDefault();
        
        const container = event.currentTarget.querySelector('.col-content');
        if(!container) return;

        const afterElement = getDragAfterElement(container, event.clientY);
        const draggable = document.querySelector('.dragging');
        
        if(draggable) {
            if (afterElement == null) {
                container.appendChild(draggable);
            } else {
                container.insertBefore(draggable, afterElement);
            }
        }
    }

    // Descobre exatamente em qual posição o mouse está passando
    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.game-card:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // 3. Ao soltar o card, salva a nova ordem e coluna no banco
    async function drop(event, newStatus) {
        if(!isAdmin) return;
        event.preventDefault();

        // O DOM já foi reordenado visualmente pela função allowDrop.
        // Agora precisamos pegar essa nova ordem do HTML e salvar no banco.
        const container = document.getElementById(`col-${newStatus}-content`);
        const cardsHTML = container.querySelectorAll('.game-card');
        
        let updates = [];

        // Atualiza o array local com a nova ordem e novo status
        cardsHTML.forEach((card, index) => {
            const gameId = parseInt(card.getAttribute('data-id'));
            const gameIndex = games.findIndex(g => g.id === gameId);
            
            if (gameIndex !== -1) {
                const game = games[gameIndex];
                if (game.status !== newStatus.toString() || game.ordem !== index) {
                    game.status = newStatus.toString();
                    game.ordem = index;
                    updates.push(game);
                }
            }
        });

        renderDashboard(); // Atualiza os contadores de hora

        // Envia as mudanças de posição para o Supabase
        for (let game of updates) {
            try {
                await fetch(`${SUPABASE_URL}?id=eq.${game.id}`, {
                    method: 'PATCH',
                    headers: getHeaders(),
                    body: JSON.stringify({ status: game.status, ordem: game.ordem })
                });
            } catch (error) {
                console.error("Erro ao reordenar:", error);
            }
        }
    }

    // ==========================================
    // RENDERIZAR TELA
    // ==========================================

    function renderDashboard() {
        document.getElementById('col-1-content').innerHTML = '';
        document.getElementById('col-2-content').innerHTML = '';
        document.getElementById('col-3-content').innerHTML = '';
        document.getElementById('col-4-content').innerHTML = '';

        let totalMinutosHistoria = 0;
        let totalMinutosPlatina = 0;
        let count1 = 0, count2 = 0, count3 = 0, count4 = 0;

        // Como o fetch já traz ordenado do banco, o forEach renderiza na ordem correta
        games.forEach(game => {
            const storyMins = parseTempoParaMinutos(game.storyHours);
            const platMins = parseTempoParaMinutos(game.platHours);
            
            totalMinutosHistoria += storyMins;
            totalMinutosPlatina += platMins;
            
            const horasTotaisDoJogo = formataMinutosParaTempo(storyMins + platMins);
            const storyText = formataMinutosParaTempo(storyMins);
            const platText = formataMinutosParaTempo(platMins);

            let ytButtonHTML = game.url 
                ? `<a href="${game.url}" target="_blank" class="btn-youtube"><i class="fa-brands fa-youtube"></i> Ver Playlist</a>` 
                : ``;

            // Atributos de drag & drop com data-id para identificar quem é quem
            const dragAttr = isAdmin ? `draggable="true" ondragstart="dragStart(event, ${game.id})" ondragend="dragEnd(event)"` : '';
            const cursorStyle = isAdmin ? 'cursor: grab;' : 'cursor: default;';
            const adminActionsHTML = isAdmin ? `
                <div class="card-actions">
                    <button class="btn-action" onclick="openModal(${game.id})"><i class="fa-solid fa-pen"></i> Editar</button>
                    <button class="btn-action delete" onclick="deleteGame(${game.id})"><i class="fa-solid fa-trash"></i> Excluir</button>
                </div>
            ` : '';

            const cardHTML = `
                <div class="game-card" data-id="${game.id}" ${dragAttr} style="${cursorStyle}">
                    <div class="game-tags">
                        <span class="game-tag">${game.platform || 'N/A'}</span>
                    </div>
                    <div class="game-title">${game.name}</div>
                    <div class="game-info">
                        <div><i class="fa-regular fa-clock"></i> <b>Total:</b> ${horasTotaisDoJogo}h</div>
                        <div><i class="fa-solid fa-book-open"></i> <b>História:</b> ${storyText}h</div>
                        <div><i class="fa-solid fa-trophy"></i> <b>Platina:</b> ${platText}h</div>
                    </div>
                    ${ytButtonHTML}
                    ${adminActionsHTML}
                </div>
            `;

            if(game.status === "1" || game.status === 1) { document.getElementById('col-1-content').innerHTML += cardHTML; count1++; }
            if(game.status === "2" || game.status === 2) { document.getElementById('col-2-content').innerHTML += cardHTML; count2++; }
            if(game.status === "3" || game.status === 3) { document.getElementById('col-3-content').innerHTML += cardHTML; count3++; }
            if(game.status === "4" || game.status === 4) { document.getElementById('col-4-content').innerHTML += cardHTML; count4++; }
        });

        const totalJogos = games.length;

        document.getElementById('statTotalHours').innerText = formataMinutosParaTempo(totalMinutosHistoria + totalMinutosPlatina) + "h";
        document.getElementById('statStoryHours').innerText = formataMinutosParaTempo(totalMinutosHistoria) + "h";
        document.getElementById('statPlatHours').innerText = formataMinutosParaTempo(totalMinutosPlatina) + "h";
        
        document.getElementById('statTotalGames').innerText = totalJogos;
        document.getElementById('headerTotalGames').innerText = totalJogos;

        document.getElementById('count-col-1').innerText = count1;
        document.getElementById('count-col-2').innerText = count2;
        document.getElementById('count-col-3').innerText = count3;
        document.getElementById('count-col-4').innerText = count4;
    }

    fetchGames();

</script>
</body>
</html>
